<section class="projects-section">
  <h2 class="section-title">Selected Projects</h2>

  <div class="projects-grid">
    <mat-card class="project-card" *ngFor="let project of projects">
      <mat-card-header>
        <mat-card-title>{{ project.title }}</mat-card-title>
        <mat-card-subtitle>{{ project.subtitle }}</mat-card-subtitle>
      </mat-card-header>

      <img mat-card-image [src]="project.image" alt="{{ project.title }} image" />

      <mat-card-content>
        <p>{{ project.description }}</p>
      </mat-card-content>

      <mat-card-actions>
        <a mat-button color="primary" [href]="project.link" target="_blank">View Live</a>
        <a mat-stroked-button color="accent" [href]="project.repo" target="_blank">GitHub</a>
      </mat-card-actions>
    </mat-card>
  </div>
</section>
