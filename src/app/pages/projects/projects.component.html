<section class="projects-wrap">
  <header class="reveal">
    <h2>Featured Enterprise Projects</h2>
    <p>Programs where I owned architecture, execution quality, and measurable business outcomes.</p>
  </header>

  <div class="projects-grid">
    <mat-card class="project-card glass reveal" *ngFor="let project of projects">
      <mat-card-header>
        <mat-card-title>{{ project.title }}</mat-card-title>
        <mat-card-subtitle>{{ project.stack }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <ul>
          <li *ngFor="let point of project.impact">{{ point }}</li>
        </ul>
      </mat-card-content>
    </mat-card>
  </div>
</section>
