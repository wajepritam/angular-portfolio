<section class="skills-wrap">
  <header class="reveal">
    <h2>Tech Stack & Engineering Capabilities</h2>
  </header>

  <div class="skills-grid">
    <article class="skill-card glass reveal" *ngFor="let group of skillGroups">
      <h3>{{ group.category }}</h3>
      <ul>
        <li *ngFor="let item of group.items">{{ item }}</li>
      </ul>
    </article>
  </div>
</section>
